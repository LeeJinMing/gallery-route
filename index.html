<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery Route</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./site.js"></script>
</head>
<body>
  <main>
    <header>
      <p class="venue">Meridian Design Museum · Demonstration venue</p>
      <h1>Gallery Route</h1>
      <p>Plan which exhibits to see and get back to the entrance within your time budget.</p>
    </header>
    <section class="card" aria-labelledby="plan-title">
      <h2 id="plan-title">Plan your visit</h2>
      <form id="planner">
        <label class="budget">Minutes available <input name="minutes" type="number" min="1" max="180" value="45" required></label>
        <fieldset>
          <legend>Route preferences</legend>
          <label><input name="stepFree" type="checkbox"> Step-free</label>
          <label><input name="quiet" type="checkbox"> Quiet</label>
        </fieldset>
        <fieldset id="exhibits"><legend>Exhibits you want to see</legend></fieldset>
        <button class="plan" type="submit">Build itinerary</button>
      </form>
      <div id="result" role="status" aria-live="polite"></div>
    </section>
    <section class="card" aria-labelledby="assistant-title">
      <h2 id="assistant-title">Ask the visit planner</h2>
      <p id="agent-status" role="status">Connecting the browser agent…</p>
      <div id="agent-app"></div>
      <a href="./agent-manifest.json">Agent manifest</a>
    </section>
  </main>
</body>
</html>
