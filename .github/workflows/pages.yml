name: Publish Gallery Route
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-route-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify and package
        run: |
          node --test route.test.mjs
          mkdir site
          cp index.html site.js style.css route.mjs gallery-actions.js browser-model.js agent-manifest.json gallery-route.network.json links.json LICENSE walkthrough.mp4 site/
          cp -r runtime bridge site/
          sed -i "s|\./site\.js\"|./site.js?v=${GITHUB_SHA}\"|; s|\./style\.css\"|./style.css?v=${GITHUB_SHA}\"|" site/index.html
          sed -i "s|\./browser-model\.js\"|./browser-model.js?v=${GITHUB_SHA}\"|" site/site.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
